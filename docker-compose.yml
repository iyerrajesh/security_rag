services:
  db:
    # Official pgvector image: Postgres 16 + pgvector >= 0.8 preinstalled.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-securityrag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-securityrag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port exposed by default — DB stays internal to the compose network.
    # Uncomment to inspect from the VM host:
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-securityrag}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      EMBED_MODEL: ${EMBED_MODEL:-voyage-3}
      EMBED_DIMS: ${EMBED_DIMS:-1024}
      ANSWER_MODEL: ${ANSWER_MODEL:-claude-sonnet-4-6}
      PARSE_MODEL: ${PARSE_MODEL:-claude-haiku-4-5-20251001}
    # ports:
    #   - "${API_PORT:-8000}:8000"
    restart: unless-stopped
  
  caddy:
    image: caddy:2
    environment:
      API_SECRET: ${API_SECRET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

  # ---- Data platform (local only) -------------------------------------------
  # Profile-gated so the production `docker compose up` never starts these.
  # Start with: docker compose --profile m1 up -d
  kafka:
    image: apache/kafka:3.8.1
    profiles: [m1]
    hostname: kafka
    environment:
      # Single-node KRaft: this node is both broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for containers on the compose network, EXTERNAL for the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init with known partition counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    profiles: [m1]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    restart: "no"

  # Avro schema registry for the validated.* topics: http://localhost:8081
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    profiles: [m1]
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Schemas are stored in the _schemas topic on our broker.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Web UI for browsing topics, messages, and consumer groups: http://localhost:8080
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: [m1]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      # Pre-register the local cluster so the UI is usable without setup.
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  caddy_data:
  kafkadata:
